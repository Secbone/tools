<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop · Secbone's Online Tools</title>
    <link rel="stylesheet" href="../style/globle.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Drop</header>

    <main class="drop">
        <section class="radar-stage">
            <div class="radar" id="radar">
                <div class="radar-ring r1"></div>
                <div class="radar-ring r2"></div>
                <div class="radar-ring r3"></div>

                <div class="radar-center">
                    <div class="device-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                            <path d="M2 20h20"></path>
                        </svg>
                    </div>
                    <div class="radar-label" id="radar-label">我的设备</div>
                </div>

                <div class="peer-layer" id="peers"></div>
                <div class="radar-empty" id="radar-empty">正在寻找附近设备…</div>
            </div>

            <div class="status" id="status">正在连接…</div>
        </section>

        <section class="sheet">
            <div class="name-row">
                <label for="name">设备名</label>
                <input id="name" type="text" maxlength="32" placeholder="给这台设备起个名字" autocomplete="off" spellcheck="false">
                <button id="save-name" type="button">保存</button>
            </div>

            <div class="room-row">
                <label for="room">房间</label>
                <input id="room" type="text" placeholder="留空 = 同网络自动" autocomplete="off" spellcheck="false">
                <button id="join" type="button">加入</button>
                <button id="auto" type="button">自动</button>
            </div>
            <div class="room-info" id="room-info"></div>

            <div class="field">
                <label for="target">目标设备</label>
                <select id="target" disabled></select>
            </div>

            <div id="dropzone" class="dropzone">
                把文件拖到这里，或点击选择
                <input id="file" type="file" hidden>
            </div>

            <div class="text-row">
                <input id="text" type="text" placeholder="发送文本…" autocomplete="off">
                <button id="send-text" type="button">发送</button>
            </div>
        </section>

        <section class="sheet">
            <h2>传输</h2>
            <div id="transfers" class="list"></div>

            <h2>收到的文件</h2>
            <div id="received" class="list"></div>

            <h2>消息</h2>
            <div id="messages" class="list messages"></div>
        </section>
    </main>

    <div id="modal" class="modal" hidden>
        <div class="modal-card">
            <h3>接收文件？</h3>
            <p id="modal-meta"></p>
            <div class="modal-actions">
                <button id="accept" type="button" class="primary">接收</button>
                <button id="reject" type="button">拒绝</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
